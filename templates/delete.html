{% extends "_base.html" %}

{% block content %}
    <h2>Eliminar Publicación</h2>
    <p>¿Estás seguro de que quieres eliminar esta publicación?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit">Sí, eliminar</button>
        <a href="{% url 'post-detail' post.pk %}">Cancelar</a>
    </form>
{% endblock content %}
