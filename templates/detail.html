{% extends "_base.html" %}

{% block content %}
    <h2>{{ post.title }}</h2>
    <p>By {{ post.author.username }}</p>
    <p>{{ post.content }}</p>
    {% if user.is_authenticated and user == post.author %}
        <a href="{% url 'post-update' post.pk %}">Editar</a>
        <a href="{% url 'post-delete' post.pk %}">Eliminar</a>
    {% endif %}
{% endblock content %}
