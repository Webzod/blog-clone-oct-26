{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>
    <header>
        <a href= "{% url 'post-list' %}"><h1>Blog</h1></a>
        
    </header>
    <main>
        <a href="{% url 'post-create' %}"><h2> Crear Post</h2></a> 

        {% if user.is_authenticated %}
            <p>Bienvenido, {{ user.username }}! <a href="{% url 'logout' %}">Cerrar sesión</a></p>
        {% else %}
            <p><a href="{% url 'login' %}">Iniciar sesión</a> 
        {% endif %}

        {% block content %}
        {% endblock content %}
    </main>
</body>
</html>
